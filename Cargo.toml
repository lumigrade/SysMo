[package]
name = "sysmo"
version = "0.1.0"
edition = "2021"
description = "A compact GNOME System Monitor style resources view with CPU/GPU temperatures, powered by the Mission Center engine"
license = "GPL-3.0-or-later"
authors = ["haibac"]

[[bin]]
name = "sysmo"
path = "src/main.rs"

[dependencies]
arrayvec = "0.7"
async-channel = "2"
rand = "0.10"
signal-hook = "0.4"

[dependencies.gtk]
package = "gtk4"
version = "0.11"
features = ["v4_14"]

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_5"]

[dependencies.pangocairo]
version = "0.22"

[dependencies.magpie-types]
path = "subprojects/magpie/types"

[dependencies.nng-c]
version = "1.11"

[dependencies.nng-c-sys]
version = "1.11"
default-features = false

[profile.release]
opt-level = 3
codegen-units = 1
